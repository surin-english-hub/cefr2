# สร้างไฟล์เสียง Listening ของชุดฝึก (practice/) และเผยแพร่เว็บรายวิชาบน GitHub Pages
# ทำงานทุกครั้งที่มีการแก้ไขใน main หรือกดรันเองจากแท็บ Actions
# ต้องตั้ง Settings → Pages → Source เป็น "GitHub Actions"
name: Build audio & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "สร้างไฟล์เสียงใหม่ทั้งหมด"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ตรวจไฟล์ชุดฝึก
        run: python practice/scripts/validate.py

      - name: ติดตั้งเครื่องมือสร้างเสียง
        timeout-minutes: 5
        run: |
          pip install edge-tts imageio-ffmpeg
          mkdir -p "$HOME/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: สร้างไฟล์เสียงที่เพิ่ม/แก้ไข
        run: python practice/scripts/build_audio.py ${{ inputs.force && '--force' || '' }}

      - name: บันทึกไฟล์เสียงกลับเข้า repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practice/audio
          if git diff --cached --quiet; then
            echo "ไม่มีไฟล์เสียงใหม่"
          else
            git commit -m "Build listening audio [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
